<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeChat — Authentication</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2'%3E%3Cpolyline points='16 18 22 12 16 6'/%3E%3Cpolyline points='8 6 2 12 8 18'/%3E%3C/svg%3E">
  <meta name="description" content="Sign in or create your CodeChat account to access smart AI conversations with web search grounding.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">

  <div class="auth-card" id="auth-container">
    <div class="auth-header">
      <div class="auth-brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
      </div>
      <h1 class="auth-title">CodeChat</h1>
      <p class="auth-subtitle">AI-assisted coding & reasoning workspace</p>
    </div>

    <div class="auth-tabs" role="tablist" aria-label="Authentication mode">
      <button class="auth-tab active" id="tab-signin" role="tab" aria-selected="true" aria-controls="form-signin">Sign In</button>
      <button class="auth-tab" id="tab-signup" role="tab" aria-selected="false" aria-controls="form-signup">Create Account</button>
    </div>

    <div id="auth-alert" class="auth-alert" role="alert">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span id="alert-text"></span>
    </div>

    <form id="form-signin" class="auth-form" role="tabpanel" aria-labelledby="tab-signin" novalidate>
      <div class="form-group">
        <label for="signin-email" class="form-label">Email Address</label>
        <input 
          type="email" 
          id="signin-email" 
          class="form-input" 
          placeholder="name@example.com" 
          autocomplete="email"
          required
        >
        <span class="field-error-text" id="signin-email-error"></span>
      </div>

      <div class="form-group">
        <label for="signin-password" class="form-label">Password</label>
        <input 
          type="password" 
          id="signin-password" 
          class="form-input" 
          placeholder="••••••••" 
          autocomplete="current-password"
          required
        >
        <span class="field-error-text" id="signin-password-error"></span>
      </div>

      <button type="submit" id="btn-signin-submit" class="btn-auth-submit">
        <span>Sign In</span>
      </button>
    </form>

    <form id="form-signup" class="auth-form" role="tabpanel" aria-labelledby="tab-signup" hidden novalidate>
      <div class="form-group">
        <label for="signup-username" class="form-label">Username</label>
        <input 
          type="text" 
          id="signup-username" 
          class="form-input" 
          placeholder="dev_alex" 
          autocomplete="username"
          maxlength="50"
          required
        >
        <span class="field-error-text" id="signup-username-error"></span>
      </div>

      <div class="form-group">
        <label for="signup-email" class="form-label">Email Address</label>
        <input 
          type="email" 
          id="signup-email" 
          class="form-input" 
          placeholder="name@example.com" 
          autocomplete="email"
          required
        >
        <span class="field-error-text" id="signup-email-error"></span>
      </div>

      <div class="form-group">
        <label for="signup-password" class="form-label">Password (min 8 characters)</label>
        <input 
          type="password" 
          id="signup-password" 
          class="form-input" 
          placeholder="••••••••" 
          autocomplete="new-password"
          minlength="8"
          required
        >
        <span class="field-error-text" id="signup-password-error"></span>
      </div>

      <button type="submit" id="btn-signup-submit" class="btn-auth-submit">
        <span>Create Account</span>
      </button>
    </form>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
