name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_IMAGE: ${{ vars.DOCKERHUB_BACKEND_IMAGE || 'codechat-backend' }}
  FRONTEND_IMAGE: ${{ vars.DOCKERHUB_FRONTEND_IMAGE || 'codechat-frontend' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 1

  test:
    name: test
    runs-on: ubuntu-latest
    needs: build
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 20s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend/dist

      - name: Typecheck
        working-directory: backend
        run: npm test

      - name: Start API for integration tests
        working-directory: backend
        env:
          PORT: "5001"
          NODE_ENV: development
          MONGODB_URI: mongodb://localhost:27017/chatbot
          JWT_SECRET: ci_jwt_secret_at_least_32_characters_long
          CORS_ORIGIN: http://localhost:5500
          GROQ_API_KEY: mock_groq_key
          TAVILY_API_KEY: mock_tavily_key
        run: |
          node dist/server.js &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5001/api/health >/dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become ready"
          exit 1

      - name: Integration tests
        working-directory: backend
        env:
          TEST_BASE_URL: http://localhost:5001/api
        run: npm run test:integration

      - name: Stop API
        if: always()
        working-directory: backend
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-push:
    name: docker-push
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Promote images to latest
        run: |
          docker buildx imagetools create \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:latest" \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          docker buildx imagetools create \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:latest" \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: docker-push
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy via SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          DOCKERHUB_FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
        run: |
          set -euo pipefail
          COMPOSE_B64="$(base64 -w0 docker-compose.prod.yml)"
          REMOTE_SCRIPT=$(cat <<EOF
          set -euo pipefail
          APP_DIR="${EC2_APP_DIR}"
          mkdir -p "\${APP_DIR}/backend"
          echo "${COMPOSE_B64}" | base64 -d > "\${APP_DIR}/docker-compose.prod.yml"
          export DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME}"
          export DOCKERHUB_BACKEND_IMAGE="${DOCKERHUB_BACKEND_IMAGE}"
          export DOCKERHUB_FRONTEND_IMAGE="${DOCKERHUB_FRONTEND_IMAGE}"
          export IMAGE_TAG="${IMAGE_TAG}"
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
          cd "\${APP_DIR}"
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          docker compose -f docker-compose.prod.yml ps
          EOF
          )
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "codeChat deploy ${IMAGE_TAG}" \
            --parameters "$(jq -n --arg script "$REMOTE_SCRIPT" '{commands: [$script]}')" \
            --query "Command.CommandId" \
            --output text)"
          echo "SSM command id: ${COMMAND_ID}"
          for i in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")"
            echo "Status: ${STATUS}"
            case "${STATUS}" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "[StandardOutputContent, StandardErrorContent]" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "[StandardOutputContent, StandardErrorContent]" \
                  --output text
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Deploy timed out waiting for SSM command"
          exit 1
